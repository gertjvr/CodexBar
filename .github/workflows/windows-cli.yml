name: Windows CLI

on:
  push:
    branches: [main, windows-cli-actions]
    paths:
      - ".github/workflows/windows-cli.yml"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/CodexBarCLI/**"
      - "Sources/CodexBarCore/**"
      - "Sources/CQuickJS/**"
      - "TestsPlugin/**"
      - "Sources/CSQLite3/**"
      - "Tests/WindowsPortabilitySmoke/**"
      - "Scripts/build_windows_cli.ps1"
      - "Scripts/package_windows_cli.ps1"
      - "Scripts/fixtures/codex_rpc.py"
  pull_request:
    paths:
      - ".github/workflows/windows-cli.yml"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/CodexBarCLI/**"
      - "Sources/CodexBarCore/**"
      - "Sources/CQuickJS/**"
      - "TestsPlugin/**"
      - "Sources/CSQLite3/**"
      - "Tests/WindowsPortabilitySmoke/**"
      - "Scripts/build_windows_cli.ps1"
      - "Scripts/package_windows_cli.ps1"
      - "Scripts/fixtures/codex_rpc.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      SWIFT_VERSION: 6.3.3
      CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS: "1"
      CODEXBAR_TEST_CODEX_FILE_ISOLATION: "1"
      CODEXBAR_TEST_SESSION_FILE_ISOLATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell scripts
        run: |
          foreach ($script in @("Scripts/build_windows_cli.ps1", "Scripts/package_windows_cli.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Set up MSVC
        uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
          host_arch: amd64

      - name: Install Swift
        timeout-minutes: 10
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          build_arch: amd64

      - name: Test portable host helpers
        timeout-minutes: 2
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "codexbar-portability-smoke.exe"
          & swiftc -swift-version 6 -parse-as-library -package-name CodexBar `
            Sources/CodexBarCore/AutoreleasePoolCompat.swift `
            Sources/CodexBarCore/JSONNumber.swift `
            Sources/CodexBarCore/Host/FileSystem/UsageFileMetadata.swift `
            Sources/CodexBarCore/Host/FileSystem/UsageDirectoryCursor.swift `
            Sources/CodexBarCore/Host/FileSystem/InterprocessFileLock.swift `
            Sources/CodexBarCore/Host/FileSystem/WindowsPrivateFile.swift `
            Sources/CodexBarCore/CredentialFileWriter.swift `
            Sources/CodexBarCore/Host/Process/WindowsProcessArguments.swift `
            Sources/CodexBarCore/Host/Process/WindowsProcessLaunch.swift `
            Sources/CodexBarCore/Host/Process/WindowsEnvironment.swift `
            Sources/CodexBarCore/Host/Process/WindowsChildProcess.swift `
            Sources/CodexBarCore/Host/PTY/WindowsPseudoConsole.swift `
            Sources/CodexBarCore/Host/Process/WindowsManagedProcess.swift `
            Sources/CodexBarCore/Host/Process/WindowsProcessIdentity.swift `
            Sources/CodexBarCore/Host/Process/ProcessPipeCapture.swift `
            Sources/CodexBarCore/BoundedTaskJoin.swift `
            Sources/CodexBarCore/Host/Process/SubprocessResult.swift `
            Sources/CodexBarCore/Host/Process/WindowsSubprocessRunner.swift `
            Sources/CodexBarCore/Host/Process/RPCChildProcess.swift `
            Sources/CodexBarCore/Host/Process/RPCChildProcessTeardown.swift `
            Sources/CodexBarCore/Host/Process/BoundedOutputBuffer.swift `
            Sources/CodexBarCLI/CLIWindowsConsole.swift `
            Sources/CodexBarCLI/CLIWindowsControlMonitor.swift `
            Sources/CodexBarCLI/CLIWindowsDashboardOutput.swift `
            Tests/WindowsPortabilitySmoke/WindowsDashboardOutputSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsCLIControlSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsProcessSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsCommandScriptSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsSubprocessSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsRPCSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsEnvironmentSmoke.swift `
            Tests/WindowsPortabilitySmoke/WindowsPTYSmoke.swift `
            Tests/WindowsPortabilitySmoke/CredentialFileSmoke.swift `
            Tests/WindowsPortabilitySmoke/PortabilitySmoke.swift -Xlinker Advapi32.lib -o $probe
          if ($LASTEXITCODE -ne 0) { throw "Portability smoke compilation failed." }
          & $probe
          if ($LASTEXITCODE -ne 0) { throw "Portability smoke checks failed." }

      - name: Verify optimized JSONL scanner
        if: ${{ !cancelled() }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "windows-jsonl-scanner.exe"
          swiftc -O -whole-module-optimization -parse-as-library `
            Sources/CodexBarCore/AutoreleasePoolCompat.swift `
            Sources/CodexBarCore/Vendored/CostUsage/CostUsageJsonl.swift `
            Tests/WindowsPortabilitySmoke/WindowsJSONLScannerSmoke.swift -o $probe
          if ($LASTEXITCODE -ne 0) { throw "Optimized JSONL scanner compilation failed." }
          & $probe
          if ($LASTEXITCODE -ne 0) { throw "Optimized JSONL scanner checks failed." }

      - name: Verify native HTTP server
        if: ${{ !cancelled() }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "windows-http-server.exe"
          swiftc -parse-as-library `
            Sources/CodexBarCLI/CLILocalHTTPServer.swift `
            Tests/WindowsPortabilitySmoke/WindowsHTTPServerSmoke.swift -Xlinker Ws2_32.lib -o $probe
          if ($LASTEXITCODE -ne 0) { throw "HTTP server compilation failed." }
          & $probe
          if ($LASTEXITCODE -ne 0) { throw "HTTP server checks failed." }

      - name: Build CodexBarCLI and test portable plugins
        id: build
        run: ./Scripts/build_windows_cli.ps1 -TestPlugins

      - name: Package and smoke test
        id: package
        timeout-minutes: 5
        env:
          CLI_BIN_DIR: ${{ steps.build.outputs.bin_dir }}
        run: |
          ./Scripts/package_windows_cli.ps1 -BinDirectory $env:CLI_BIN_DIR -Version "dev-$($env:GITHUB_SHA.Substring(0, 12))"

      - name: Upload Windows CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codexbar-cli-windows-x86_64
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codexbar-cli-windows-x86_64-logs
          path: |
            .build/windows-logs/*.log
            ${{ runner.temp }}/install*.log*
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: |
          @"
          ## Windows CLI

          - Swift: $env:SWIFT_VERSION
          - Target: native Windows x86_64
          - Build: $env:BUILD_RESULT
          - Package and smoke test: $env:PACKAGE_RESULT

          The executable ZIP is uploaded only after compilation and packaged smoke tests succeed.
          A logs artifact alone does not indicate that a Windows executable was produced.
          "@ >> $env:GITHUB_STEP_SUMMARY
