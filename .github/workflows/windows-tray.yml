name: Windows tray

on:
  push:
    branches: [main, windows-cli-actions]
    paths:
      - ".github/workflows/windows-tray.yml"
      - "Sources/CodexBarWindowsTray/**"
      - "Tests/WindowsTraySmoke/**"
      - "Scripts/windows-tray.manifest"
      - "Scripts/test_windows_tray.ps1"
      - "Scripts/build_windows_cli.ps1"
      - "Scripts/build_windows_icon.ps1"
      - "Scripts/WindowsProviderIcons/**"
      - "Scripts/build_windows_provider_icons.swift"
      - "Icon.icon/Assets/codexbar.png"
      - "Scripts/package_windows_cli.ps1"
      - "Scripts/fixtures/codex_rpc.py"
      - "Package.swift"
  pull_request:
    paths:
      - ".github/workflows/windows-tray.yml"
      - "Sources/CodexBarWindowsTray/**"
      - "Tests/WindowsTraySmoke/**"
      - "Scripts/windows-tray.manifest"
      - "Scripts/test_windows_tray.ps1"
      - "Scripts/build_windows_cli.ps1"
      - "Scripts/build_windows_icon.ps1"
      - "Scripts/WindowsProviderIcons/**"
      - "Scripts/build_windows_provider_icons.swift"
      - "Icon.icon/Assets/codexbar.png"
      - "Scripts/package_windows_cli.ps1"
      - "Scripts/fixtures/codex_rpc.py"
      - "Package.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PowerShell scripts
        run: |
          foreach ($script in @("build_windows_cli.ps1", "package_windows_cli.ps1", "build_windows_icon.ps1", "test_windows_tray.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE "Scripts/$script"), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Set up MSVC
        uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
          host_arch: amd64
      - name: Install Swift
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          build_arch: amd64
      - name: Test tray dashboard projection
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "tray-snapshot.exe"
          swiftc -swift-version 6 -parse-as-library `
            Sources/CodexBarWindowsTray/TraySnapshot.swift `
            Sources/CodexBarWindowsTray/TrayPresentationState.swift `
            Tests/WindowsTraySmoke/TraySnapshotSmoke.swift -o $probe
          if ($LASTEXITCODE -ne 0) { throw "Tray projection compilation failed." }
          & $probe
          if ($LASTEXITCODE -ne 0) { throw "Tray projection checks failed." }
      - name: Build original application icon
        run: ./Scripts/build_windows_icon.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP "tray-preview-icon")
      - name: Compile native tray window
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "tray-window.exe"
          $iconResource = Join-Path $env:RUNNER_TEMP "tray-preview-icon/codexbar.res"
          swiftc -swift-version 6 -parse-as-library `
            Sources/CodexBarWindowsTray/TraySnapshot.swift `
            Sources/CodexBarWindowsTray/TrayPresentationState.swift `
            Sources/CodexBarWindowsTray/TrayProviderConfiguration.swift `
            Sources/CodexBarWindowsTray/WindowsTrayDrawing.swift `
            Sources/CodexBarWindowsTray/WindowsTrayHost.swift `
            Tests/WindowsTraySmoke/TrayWindowSmoke.swift `
            -Xlinker User32.lib -Xlinker Gdi32.lib -Xlinker Shell32.lib -Xlinker Comctl32.lib -Xlinker UxTheme.lib -Xlinker $iconResource `
            -Xlinker /SUBSYSTEM:WINDOWS -Xlinker /ENTRY:mainCRTStartup -o $probe
          if ($LASTEXITCODE -ne 0) { throw "Tray window compilation failed." }
      - name: Inspect native GUI dependencies
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "tray dependency café 测试"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $probe = Join-Path $directory "CodexBarTray.exe"
          Copy-Item (Join-Path $env:RUNNER_TEMP "tray-window.exe") $probe
          dumpbin.exe /NOLOGO /DEPENDENTS $probe
          if ($LASTEXITCODE -ne 0) { throw "Native GUI dependency inspection failed." }
      - name: Run native tray with offline fixture
        timeout-minutes: 1
        run: |
          ./Scripts/test_windows_tray.ps1 -Executable (Join-Path $env:RUNNER_TEMP "tray-window.exe")
      - name: Verify overflowing tray content
        timeout-minutes: 1
        run: |
          ./Scripts/test_windows_tray.ps1 -Executable (Join-Path $env:RUNNER_TEMP "tray-window.exe") `
            -Overflow -OutputDirectory ".build/windows-tray-preview/overflow"
      - name: Upload native tray previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tray-preview
          path: .build/windows-tray-preview/
          if-no-files-found: ignore
      - name: Build tray and companion CLI
        id: build
        run: ./Scripts/build_windows_cli.ps1 -WithTray
      - name: Preserve compiled executables for diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tray-unpackaged-diagnostic-executables
          path: .build/x86_64-unknown-windows-msvc/release/*.exe
          if-no-files-found: error
      - name: Package tray and companion CLI
        id: package
        timeout-minutes: 5
        env:
          CLI_BIN_DIR: ${{ steps.build.outputs.bin_dir }}
        run: |
          ./Scripts/package_windows_cli.ps1 -BinDirectory $env:CLI_BIN_DIR -IncludeTray -Version "dev-$($env:GITHUB_SHA.Substring(0, 12))"
      - name: Upload Windows app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codexbar-windows-x86_64
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
      - name: Upload packaged preview and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tray-build-diagnostics
          path: |
            .build/windows-tray-packaged-preview/
            .build/windows-tray-packaged-cli-preview/
            .build/windows-logs/
          if-no-files-found: ignore
